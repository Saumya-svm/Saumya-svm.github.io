short_bio: >-
  <p>
    I'm an MS by Research student in Computer Science and Engineering at
    <a href="https://www.iiit.ac.in/" target="_blank">IIIT Hyderabad</a>, working at
    <a href="https://cvit.iiit.ac.in/" target="_blank">CVIT</a> under the guidance of
    Prof. C. V. Jawahar and Dr. Ajoy Mondal. Before this, I completed my B.Tech in Chemical Engineering
    at IIT Hyderabad.
  </p>
  <p>
    My research focuses on computer vision and multimodal LLMs: building benchmarks and datasets
    that probe how models perceive and reason about the visual world. I developed
    <a href="https://saumya-svm.github.io/mist.github.io/" target="_blank">MIST</a>, a benchmark for
    multilingual incidental scene text detection (WACV 2026), and I'm currently studying how multimodal
    LLMs localize objects from compositional referring descriptions and reason about geometric
    transformations.
  </p>

