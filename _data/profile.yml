short_bio: >-
  <p>
    I'm an MS by Research student in Computer Science and Engineering at
    <a href="https://www.iiit.ac.in/" target="_blank" rel="noopener noreferrer">IIIT Hyderabad</a>, advised by
    <a href="https://faculty.iiit.ac.in/~jawahar/" target="_blank" rel="noopener noreferrer">Prof. C. V. Jawahar</a> and
    <a href="https://people.iith.ac.in/vineethnb/" target="_blank" rel="noopener noreferrer">Prof. Vineeth N. Balasubramanian</a>.
    My research has focused on computer vision and multimodal visual reasoning, particularly understanding
    where visual models struggle in challenging real-world scenes.
  </p>
  <p>
    At <a href="https://cvit.iiit.ac.in/" target="_blank" rel="noopener noreferrer">CVIT</a>, working with Dr. Ajoy Mondal,
    I worked on <a href="https://saumya-svm.github.io/mist/" target="_blank" rel="noopener noreferrer">MIST</a>, a benchmark
    for multilingual incidental scene text detection (WACV 2026), and
    <a href="https://saumya-svm.github.io/MIMO-Bench/" target="_blank" rel="noopener noreferrer">MIMO-Bench</a>, which
    investigates the ability of multimodal LLMs to reason about objects in dense multi-instance scenes.
  </p>
  <p>
    More recently, I have been exploring geometric computer vision, 3D perception, and representations for
    robot navigation, including an ongoing collaboration with
    <a href="https://oravus.github.io/" target="_blank" rel="noopener noreferrer">Prof. Sourav Garg</a>. I am particularly
    interested in how visual models acquire geometric and spatial understanding.
  </p>

